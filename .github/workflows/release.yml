name: Release

# release-please keeps a release PR open against canary that accumulates the
# next version's changelog from the squash-merged Conventional Commit titles.
# Merging that PR tags the module (v1.2.3) and publishes the GitHub release.
#
# It runs with the default GITHUB_TOKEN. GitHub does not start workflows for
# pull requests that token opened, so after release-please has created or
# updated its PR, this workflow dispatches CI on the PR's branch itself; a
# workflow_dispatch run is the documented exception.
on:
  push:
    branches: [canary]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: canary
      - name: Run CI on the release PR
        # The env block is evaluated even when the step is skipped, so the
        # PR JSON is parsed in the shell rather than with fromJSON here.
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.release.outputs.pr }}
        run: gh workflow run ci.yml --ref "$(jq -r .headBranchName <<<"$PR")"
